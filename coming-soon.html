<!DOCTYPE html>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #faf8f5;
            color: #1f2937;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            text-align: center;
            max-width: 500px;
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        h1 span {
            color: #166534;
        }

        .tagline {
            color: #6b7280;
            font-size: 1.125rem;
            margin-bottom: 2rem;
        }

        .message {
            background: white;
            border: 1px solid #e5e2dd;
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .message p {
            color: #6b7280;
            line-height: 1.7;
        }

        .links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links a {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            background: white;
            border: 1px solid #e5e2dd;
            border-radius: 8px;
            color: #1f2937;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .links a:hover {
            border-color: #166534;
            color: #166534;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 2rem;
            }

            .links {
                flex-direction: column;
            }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
