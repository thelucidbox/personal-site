<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog — Fabian Aguilar</title>
    <meta name="description" content="Thoughts on AI, productivity, and building in public.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="blog.css">
</head>
<body>
    <!-- Page Loader -->
    <div id="page-loader" class="loader">
        <div class="loader-content">
            <div class="loader-text">
                <span class="loader-char">L</span>
                <span class="loader-char">O</span>
                <span class="loader-char">A</span>
                <span class="loader-char">D</span>
                <span class="loader-char">I</span>
                <span class="loader-char">N</span>
                <span class="loader-char">G</span>
            </div>
            <div class="loader-bar">
                <div class="loader-progress"></div>
            </div>
        </div>
    </div>

    <!-- Cursor Trail -->
    <div id="cursor-trail"></div>

    <!-- Floating Particles -->
    <div id="particles"></div>

    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <a href="../" class="nav-logo">FA<span class="accent">.</span></a>
            <div class="nav-links">
                <a href="../#about" class="nav-link">About</a>
                <a href="../#projects" class="nav-link">Projects</a>
                <a href="./" class="nav-link active">Blog</a>
                <a href="../#connect" class="nav-link">Connect</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                    <span class="theme-icon"></span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Blog Header -->
    <header class="blog-header">
        <div class="section-container">
            <p class="blog-header-label">Writing</p>
            <h1 class="blog-header-title">Blog</h1>
            <p class="blog-header-subtitle">
                Thoughts on <span class="highlight-cyan">AI</span>,
                <span class="highlight-magenta">productivity</span>,
                and building in public.
            </p>
        </div>
    </header>

    <!-- Blog Posts List -->
    <main class="blog-main">
        <div class="section-container">
            <div class="blog-list" id="blog-list">
                <!-- Posts loaded dynamically -->
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <p class="footer-text">
                <span class="footer-year">© 2026</span>
                Fabian Aguilar
                <span class="footer-separator">·</span>
                <a href="../" class="footer-link">Home</a>
            </p>
        </div>
    </footer>

    <!-- Back to Top -->
    <button id="back-to-top" class="back-to-top" aria-label="Back to top">
        <span class="back-to-top-icon">↑</span>
    </button>

    <!-- Scripts -->
    <script src="../js/loader.js"></script>
    <script src="../js/effects.js"></script>
    <script src="../js/main.js"></script>
    <script>
        // Load all blog posts
        (async function() {
            try {
                const response = await fetch('posts.json');
                const posts = await response.json();

                const container = document.getElementById('blog-list');
                container.innerHTML = posts.map(post => `
                    <article class="blog-list-item">
                        <div class="blog-list-meta">
                            <span class="blog-date">${new Date(post.date).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</span>
                            <span class="blog-read-time">${post.readTime}</span>
                        </div>
                        <h2 class="blog-list-title">
                            <a href="${post.slug}.html">${post.title}</a>
                        </h2>
                        <p class="blog-list-excerpt">${post.excerpt}</p>
                        <div class="blog-list-tags">
                            ${post.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
                        </div>
                        <a href="${post.slug}.html" class="blog-link">Read Article →</a>
                    </article>
                `).join('');

                // Apply reveal animation
                document.querySelectorAll('.blog-list-item').forEach((item, i) => {
                    item.classList.add('reveal');
                    setTimeout(() => item.classList.add('active'), 100 * (i + 1));
                });
            } catch (error) {
                document.getElementById('blog-list').innerHTML = `
                    <p class="blog-empty">No posts yet. Check back soon!</p>
                `;
            }
        })();
    </script>
</body>
</html>
